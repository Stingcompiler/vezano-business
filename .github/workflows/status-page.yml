name: Status page

# صفحة الحالة المستقلة على GitHub Pages (0005 §١٥٧): شاشة PUB-03 نفسها بعيداً عن خادم OVH، ومُبلَغة من
# السودان (عناوين Cloudflare Pages ليست كذلك). تُنشر حين تتغيّر الشاشة أو ما حولها على main، أو يدوياً.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/src/features/public/**"
      - "apps/web/src/app/status/**"
      - "apps/web/src/app/layout.tsx"
      - "packages/ui-web/**"
      - "packages/design/**"
      - "deploy/status-page/**"
      - ".github/workflows/status-page.yml"
  workflow_dispatch:

concurrency:
  group: status-page
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Build PUB-03
        env:
          # الصفحة على أصل آخر: تسأل الخادم الرئيسي بعنوانه الكامل
          NEXT_PUBLIC_API_URL: https://plus.vezano.app
          NEXT_DIST_DIR: .next-status
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @sting/web build
          cd apps/web && node ../../deploy/status-page/scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/status-page/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
