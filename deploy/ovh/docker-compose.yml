# فيزانو بلص على خادم خاص (OVHcloud VPS) — 0005 §١٤٠. الخطوات في docs/deploy-ovh.md.
#
#   caddy  :80/:443  HTTPS تلقائي → web
#   web    Next.js؛ يمرّر /api/* داخلياً إلى api (أصل واحد، بلا CORS)
#   api    Django + gunicorn؛ الهجرات وأعلام الإطلاق عند كل تشغيل؛ لا منفذ خارجي
#   worker المهام المجدولة: النسخة الليلية 01:00 UTC و grow_compute 04:00 UTC
#   db     PostgreSQL 16؛ التطبيق بدور بلا تجاوز لـRLS، والنسخ بالمشرف
#
# الأسرار كلها في deploy/ovh/.env (لا يُلتزم) — انسخه من .env.example.

x-api-env: &api-env
  STING_ENV: production
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: api,localhost
  DB_CONN_MAX_AGE: "60"
  DATABASE_URL: postgresql://vezano:${APP_DB_PASSWORD}@db:5432/vezano
  # الزائر خلف Caddy ثم Next = ثاني عنوان من اليمين في X-Forwarded-For
  STING_PROXY_HOPS: "2"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vezano"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ../../backend
    image: vezano-api
    restart: unless-stopped
    env_file: .env
    environment: *api-env
    command: >-
      sh -c "uv run --no-sync python manage.py migrate --noinput &&
      uv run --no-sync python manage.py apply_launch_flags &&
      exec uv run --no-sync gunicorn sting.wsgi:application
      --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 60"
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: vezano-api
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *api-env
      BACKUP_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/vezano
    command: ["/app/deploy/scheduler.sh"]
    volumes:
      - backups:/backups
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # على خادم فيه وكيل عكسي أصلاً (Caddy النظام): يُنشر على 127.0.0.1 فقط ويشير إليه الوكيل
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    depends_on:
      - api

  # خادم فارغ بلا وكيل: `docker compose --profile caddy up -d` — وإلا يبقى الوكيل الموجود على الخادم
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  db:
  backups:
  caddy_data:
  caddy_config:
