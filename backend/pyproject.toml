[project]
name = "sting-backend"
version = "0.0.0"
description = "Sting Systems — Django/DRF Modular Monolith (§٤.١)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "djangorestframework-simplejwt>=5.5",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.12",
    "mypy>=1.14",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "T20"]
ignore = ["S101"]  # assert مسموح في الاختبارات

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]
"sting/settings.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "sting.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sting.settings"
python_files = ["test_*.py"]
testpaths = ["tests", "core", "sync", "catalog"]
addopts = "-q --strict-markers"
